<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Тест для спасателей ПСР</title>
    <!-- Применяем тему мгновенно, до загрузки JS -->
    <script>
      try {
        if (localStorage.getItem('psr_quiz_theme') !== 'light') {
          document.documentElement.classList.add('dark');
        }
      } catch(e) { document.documentElement.classList.add('dark'); }
    </script>
    <style>
      /* Прелоадер */
      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      html:not(.dark) #preloader {
        background: #f8fafc;
        color: #334155;
      }
      #preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #preloader .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      html:not(.dark) #preloader .spinner {
        border-color: rgba(0,0,0,0.08);
        border-top-color: #059669;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #preloader p {
        margin-top: 16px;
        font-size: 14px;
        opacity: 0.7;
      }
    </style>

полнения задачи по ликвидации ЧС",isCorrect:!1},{id:"2с",text:"Самочувствием спасателя и способностью продолжать работать",isCorrect:!1}]},{id:3,text:"Что такое адаптация человека?",options:[{id:"3a",text:"Протекание психических процессов в зависимости от состояния и явлений действительности",isCorrect:!1},{id:"3b",text:"Устойчивое психическое состояние человека в различных условиях",isCorrect:!1},{id:"3c",text:"Процесс приспособления человека к условиям внешней среды",isCorrect:!0}]},{id:4,text:"Какой максимально допустимый наклон насосной станции при работающем двигателе",options:[{id:"4a",text:"Не более 20 градусов",isCorrect:!0},{id:"4b",text:"Не более 30 градусов",isCorrect:!1},{id:"4c",text:"Не более 40 градусов",isCorrect:!1}]},{id:5,text:"Пожар это -",options:[{id:"5a",text:"Сложный физико-химический процесс превращения компонентов горючей смеси в продукты сгорания с выделением теплового излучения, света и лучистой энергии",isCorrect:!1},{id:"5b",text:"Сложный физико-химический процесс причиняющий материальный ущерб, вред жизни и здоровью людей, интересам общества и государства",isCorrect:!1},{id:"5c",text:"Неконтролируемый физико-химический процесс превращения компонентов горючей смеси в продукты сгорания",isCorrect:!1},{id:"5d",text:"Неконтролируемое горение, причиняющее материальный ущерб, вред жизни и здоровью граждан, интересам общества и государства",isCorrect:!0}]},{id:6,text:"При аварии на хладокомбинате следует использовать",options:[{id:"6a",text:"Промышленный противогаз (коробка серого цвета)",isCorrect:!0},{id:"6b",text:"Промышленный противогаз (коробка желтого цвета)",isCorrect:!1},{id:"6c",text:"Достаточно использовать общевойсковой фильтрующий противогаз",isCorrect:!1}]},{id:7,text:"Тушение пожаров – это",options:[{id:"a",text:"Силы и средства сосредоточенные на решающем направлении и выполняющие боевую задачу",isCorrect:!1},{id:"b",text:"Действия пожарных подразделений направленные на полное прекращение огня, а так же на исключение возможности его повторного возникновения",isCorrect:!1},{id:"c",text:"Действия, направленные на спасение людей, имущества и ликвидацию пожаров",isCorrect:!0},{id:"d",text:"Действия, направленные на спасение людей, имущества, ликвидацию горения и устранения условий для его повторного возникновения",isCorrect:!1}]},{id:8,text:"Для защиты от хлора следует",options:[{id:"a",text:"Подняться повыше",isCorrect:!0},{id:"b",text:"Остаться на месте",isCorrect:!1},{id:"c",text:"Спрятаться в подвал",isCorrect:!1}]},{id:9,text:"Что не относиться к основным приемам «активного слушания»?",options:[{id:"a",text:"отражение чувств собеседника",isCorrect:!1},{id:"b",text:"пара фраз",isCorrect:!1},{id:"c",text:"резюме",isCorrect:!1},{id:"d",text:"монолог",isCorrect:!0}]},{id:10,text:"На какое максимально время можно оставлять включенный двигатель бензопилы или бензореза при ее остановке",options:[{id:"a",text:"Не более 5 минут",isCorrect:!0},{id:"b",text:"Не более 10 минут",isCorrect:!1},{id:"c",text:"Не более 15 минут",isCorrect:!1}]},{id:11,text:"При переломах костей конечностей накладывается шина:",options:[{id:"a",text:"Ниже области перелома",isCorrect:!1},{id:"b",text:"Выше и ниже области перелома, так чтобы шина захватывала один сустав выше перелома и все суставы ниже перелома",isCorrect:!0},{id:"c",text:"Выше области перелома",isCorrect:!1}]},{id:12,text:"В каком случаи в ходе спасательных работ из автомобиля необходимо добавить точку стабилизации:",options:[{id:"a",text:"При установке домкрата для отодвигания приборной панели с целю создания свободного пространства – под задний конец домкрата (для предотвращения переламывания кузова)",isCorrect:!0},{id:"b",text:"В случае если уже установленные точки стабилизации потеряли фиксацию",isCorrect:!1},{id:"c",text:"В случае выражения сомнения в надежности стабилизации автомобиля хотя бы одним из участников спасательных работ",isCorrect:!1}]},{id:13,text:"Сроки проведения разведки пожара",options:[{id:"a",text:"С момента сообщения о пожаре и до его ликвидации проводится разведка пожара",isCorrect:!0},{id:"b",text:"С момента выезда подразделения и до полной ликвидации пожара",isCorrect:!1},{id:"c",text:"С момента прибытия подразделения на пожар и до его ликвидации",isCorrect:!1},{id:"d",text:"С момента сообщения о пожаре и до начала тушения пожара",isCorrect:!1}]},{id:14,text:"Патроны РП используемые в изолирующем противогазе предназначены для:",options:[{id:"a",text:"Регенерации воздуха",isCorrect:!0},{id:"b",text:"Ингаляции воздуха",isCorrect:!1},{id:"c",text:"Абсорбции воздуха",isCorrect:!1}]},{id:15,text:"Острые стрессовые реакции возникают",options:[{id:"a",text:"в течение нескольких месяцев после произошедшего события",isCorrect:!1},{id:"b",text:"в момент события, длительностью до нескольких дней",isCorrect:!0},{id:"c",text:"в течение нескольких лет после события",isCorrect:!1}]},{id:16,text:"В каком случае разрешается переносить механизированный инструмент (бензопилу) в работающем состоянии",options:[{id:"a",text:"Только в случае проведения неотложных работ и только обращённым рабочими поверхностями по ходу движения от работника",isCorrect:!1},{id:"b",text:"Не разрешается",isCorrect:!0},{id:"c",text:"Разрешается при согласовании с руководителем работ и предупреждении остальных работающих",isCorrect:!1}]},{id:17,text:"Перечислите виды ожогов",options:[{id:"a",text:"Химические, термические, радиационные, электрические",isCorrect:!0},{id:"b",text:"Химические, электрические, щелочные, термические",isCorrect:!1},{id:"c",text:"Электрические, щелочные, кислотные, радиационные, термические",isCorrect:!1}]},{id:18,text:"Имеется необходимость удалении крыши. Вклеенное лобовое стекло препятствует этому. Что необходимо предпринять?",options:[{id:"a",text:"Выдавить лобовое стекло изнутри",isCorrect:!1},{id:"b",text:"Оторвать вручную лобовое стекло от крыши или кузова",isCorrect:!1},{id:"c",text:"Разрезать лобовое стекло сабельной пилой или ручной пилой для стекла",isCorrect:!0}]},{id:19,text:"Горение каких материалов относится к пожару класса D?",options:[{id:"a",text:"Пожары металлов",isCorrect:!0},{id:"b",text:"Пожары твердых горючих веществ и материалов",isCorrect:!1},{id:"c",text:"Пожары горючих жидкостей",isCorrect:!1},{id:"d",text:"Пожары горючих веществ и материалов электроустановок, находящихся под напряжением",isCorrect:!1},{id:"e",text:"Пожары ядерных материалов, радиоактивных отходов и радиоактивных веществ",isCorrect:!1},{id:"f",text:"Пожары газов",isCorrect:!1}]},{id:20,text:"Изолирующий противогаз предназначен",options:[{id:"a",text:"Для защиты органов дыхания от СО, аммиака, хлора, неизвестного ОВ",isCorrect:!0},{id:"b",text:"Для защиты органов дыхания только от АХОВ и ОВ",isCorrect:!1},{id:"c",text:"Для защиты органов дыхания только от угарного газа",isCorrect:!1}]},{id:21,text:"Горение каких материалов относится к пожару класса A?",options:[{id:"21a",text:"Пожары металлов и их сплавов",isCorrect:!1},{id:"21b",text:"Пожары газов",isCorrect:!1},{id:"21c",text:"Пожары твердых горючих веществ и материалов",isCorrect:!0},{id:"21d",text:"Пожары горючих жидкостей или плавящихся твердых веществ и материалов",isCorrect:!1},{id:"21e",text:"Пожары горючих веществ и материалов электроустановок, находящихся под напряжениемпожары горючих веществ и материалов электроустановок, находящихся под напряжением",isCorrect:!1},{id:"21f",text:"Пожары ядерных материалов, радиоактивных отходов и радиоактивных веществ",isCorrect:!1}]},{id:22,text:"Для защиты от аммиака используется",options:[{id:"22a",text:"Промышленный противогаз (коробка серого цвета)",isCorrect:!0},{id:"22b",text:"Промышленный противогаз (коробка желтого цвета)",isCorrect:!1},{id:"22c",text:"Общевойсковой фильтрующий противогаз",isCorrect:!1}]},{id:23,text:"Какое рабочее давление подушек высокого давления Holmatro",options:[{id:"23a",text:"Давление 8 бар",isCorrect:!0},{id:"23b",text:"Давление не более 16 бар",isCorrect:!1},{id:"23c",text:"Давление 18 бар",isCorrect:!1}]},{id:24,text:"Что необходимо сделать, если пострадавший находится в состоянии: дышит и без сознания?",options:[{id:"24a",text:"Придать устойчивое боковое положение",isCorrect:!0},{id:"24b",text:"Положить на спину, на гладкую твердую поверхность",isCorrect:!1},{id:"24c",text:"Наклонить голову и согнуть ноги в коленях",isCorrect:!1}]},{id:25,text:"Выберите правильные варианты действий при спасении пострадавших из автомобиля, находящегося на железнодорожных путях:",options:[{id:"25a",text:"Послать сигнальщиков (днем сигнал яркого цвета, ночью сигнал фонарем, круговыми движениями) в обе стороны железнодорожных путей для подачи сигнала поездам об экстренном торможении, на расстоянии не менее 1,5 км",isCorrect:!1},{id:"25b",text:"Сообщить об аварии поездному диспетчеру дистанции пути",isCorrect:!1},{id:"25c",text:"При приближении поезда выполнить экстренное извлечение пострадавших",isCorrect:!1},{id:"25d",text:"Послать сигнальщиков в обе стороны железнодорожных путей для подачи сигнала поездам об экстренном торможении и при приближении поезда выполнить экстренное извлечение пострадавших",isCorrect:!0}]},{id:26,text:"Легкий защитный костюм Л-1 предназначен",options:[{id:"26a",text:"Для защиты кожных покровов и одежды от РВ, ОВ, БС и АХОВ",isCorrect:!0},{id:"26b",text:"Для защиты кожных покровов и одежды только от ОВ",isCorrect:!1},{id:"26c",text:"Для защиты кожных покровов и одежды только от РВ и ОВ ",isCorrect:!1}]},{id:27,text:"Что не относится к приемам подавления истерики:",options:[{id:"27a",text:"говорить с пострадавшим короткими фразами, уверенным тоном",isCorrect:!1},{id:"27b",text:"уложить пострадавшего спать",isCorrect:!1},{id:"27c",text:"позвать людей, чтобы создать толпу зрителей",isCorrect:!0},{id:"27d",text:"неожиданно совершить действие, которое может сильно удивить",isCorrect:!1}]},{id:28,text:"Превышения рабочего давления во сколько раз гарантированно не приводит к разрыву подушки высокого давления ",options:[{id:"28a",text:"В 2 раза ",isCorrect:!1},{id:"28b",text:"В 4 раза",isCorrect:!0},{id:"28c",text:"В 10 раз",isCorrect:!1}]},{id:29,text:"Как проводится транспортировка пострадавшего с односторонней травмой грудной клетки при потере сознания?",options:[{id:"29a",text:"Лежа на пораженном боку",isCorrect:!0},{id:"29b",text:"Лежа на здоровом боку",isCorrect:!1},{id:"29c",text:"Лежа на спине",isCorrect:!1},{id:"29d",text:"Лежа на животе",isCorrect:!1},{id:"29e",text:"В сидячем положении",isCorrect:!1}]},{id:30,text:"Какую клемму следуют отсоединять первой при отключении аккумуляторной батареи?",options:[{id:"30a",text:"Отрицательную",isCorrect:!0},{id:"30b",text:"Не имеет значения",isCorrect:!1},{id:"30c",text:"Положительную",isCorrect:!1}]},{id:31,text:"Что не относится к приемам выведения пострадавшего из ступора",options:[{id:"31a",text:"оставить пострадавшего в таком состоянии",isCorrect:!0},{id:"31b",text:"говорить медленно и четко, чтобы вызвать негативные эмоции",isCorrect:!1},{id:"31c",text:"стараться подстроить свое дыхание под ритм дыхания пострадавшего",isCorrect:!1},{id:"31d",text:"дать пощечину",isCorrect:!1}]},{id:32,text:"Как необходимо удерживать бензопилу?",options:[{id:"32a",text:"Правилами установлены требования: «Удерживать инструмент нужно исключительно двумя руками»",isCorrect:!0},{id:"32b",text:"Работник - левша левой рукой держит за заднюю ручку и правой за переднюю. Работник правша правой рукой держит заднюю ручку, а левой переднюю",isCorrect:!1},{id:"32c",text:"В исключительных случаях при дополнительных мерах страховки,",isCorrect:!1}]},{id:33,text:"В каких случаях наносится прекордиальный удар при оказании первой помощи:",options:[{id:"33a",text:"Прекордиальный удар не наносится",isCorrect:!0},{id:"33b",text:"При отсутствии у пострадавшего признаков жизни",isCorrect:!1},{id:"33c",text:"При отсутствии эффекта от проводимой сердечно-легочной реанимации",isCorrect:!1},{id:"33d",text:"При появлении у пострадавшего болей за грудиной",isCorrect:!1}]},{id:34,text:"При невозможности обесточить аккумулятор необходимо:",options:[{id:"34a",text:"Включить аварийную световую сигнализацию («аварийка»)",isCorrect:!0},{id:"34b",text:"Лично сообщить об этом всем участникам спасательных работ",isCorrect:!1},{id:"34c",text:"Доложить руководителю ликвидации чрезвычайной ситуации",isCorrect:!1}]},{id:35,text:"Какой этап не входит в боевое развёртывание",options:[{id:"35a",text:"Подготовка к боевому развёртыванию",isCorrect:!1},{id:"35b",text:"Полное боевое развёртывание",isCorrect:!1},{id:"35c",text:"Предварительное боевое развёртывание",isCorrect:!1},{id:"35d",text:"Начало боевого развёртывания",isCorrect:!0}]},{id:36,text:"Как расшифровывается аббревиатура АХОВ",options:[{id:"36a",text:"Аварийно-химические опасные вещества",isCorrect:!0},{id:"36b",text:"Аварийно-химические отравляющие вещества",isCorrect:!1},{id:"36c",text:"Аммиак, хлор, отравляющие вещества",isCorrect:!1}]},{id:37,text:"Увеличение в речи пострадавшего количества пауз может быть связано с:",options:[{id:"37a",text:"негативным отношением человека к себе, другим, жизни",isCorrect:!1},{id:"37b",text:"переживанием сильного эмоционального волнения",isCorrect:!0},{id:"37c",text:"нежеланием озвучивать информацию",isCorrect:!1}]},{id:38,text:"Разрешено ли давать пострадавшему лекарственные средства при оказании ему первой помощи",options:[{id:"38a",text:"Разрешено",isCorrect:!1},{id:"38b",text:"Запрещено",isCorrect:!0},{id:"38c",text:"Разрешено в случае крайней необходимости",isCorrect:!1}]},{id:39,text:"При каких условиях допустимо использовать бензорез для деблокирования пострадавших их автомобиля",options:[{id:"39a",text:"Не допустимо в любом случае ",isCorrect:!1},{id:"39b",text:"При невозможности деблокирования другими средствами и выполнении трех условий:",isCorrect:!0},{id:"39c",text:"При невозможности деблокирования другими средствами при выполнении следующих условий:",isCorrect:!1}]},{id:40,text:"Какая проводится первая помощь, пораженным АХОВ",options:[{id:"40a",text:"Надеть противогаз, эвакуировать из зоны поражения, провести частичную СО",isCorrect:!0},{id:"40b",text:"Эвакуировать из зоны поражения, провести дегазацию, дать обильное питье",isCorrect:!1},{id:"40c",text:"Эвакуировать из зоны поражения, провести дегазацию, вызвать врача",isCorrect:!1}]},{id:41,text:"Стресс, возникающий при непрерывном или регулярном стрессовом воздействии, сила которого, как правило, невелика",options:[{id:"41a",text:"острый",isCorrect:!1},{id:"41b",text:"отложенный",isCorrect:!1},{id:"41c",text:"хронический",isCorrect:!0}]},{id:42,text:"Как часто нужно затачивать цепь бензопилы ",options:[{id:"42a",text:"После каждых 5 моточасов",isCorrect:!1},{id:"42b",text:"Каждый месяц",isCorrect:!1},{id:"42c",text:"Когда уменьшается размер стружки или снижается производительность пиления",isCorrect:!0}]},{id:43,text:"Алгоритм сердечно-легочной реанимации, выполняемой при оказании первой помощи:",options:[{id:"43a",text:"5 надавливаний на грудную клетку – 1 вдувание воздуха",isCorrect:!1},{id:"43b",text:"15 надавливаний на грудную клетку – 2 вдувания воздуха",isCorrect:!1},{id:"43c",text:"30 надавливаний на грудную клетку – 2 вдувания воздуха",isCorrect:!0},{id:"43d",text:"40 надавливаний на грудную клетку – 2 вдувания воздуха",isCorrect:!1}]},{id:44,text:"От каких факторов зависит дистанция установки оградительных конусов:",options:[{id:"44a",text:"Дистанция установки оградительных конусов не зависит от условий а указана в правилах дорожного движения",isCorrect:!1},{id:"44b",text:"От количества автомобилей, попавших в ДТП",isCorrect:!1},{id:"44c",text:"От скорости движения автомобилей на участке дороги и условий видимости",isCorrect:!0}]},{id:45,text:"Локализация пожара это -",options:[{id:"45a",text:"Направление на котором сосредоточены силы и средства, выполняющие боевую задачу",isCorrect:!1},{id:"45b",text:"Действие пожарных подразделений направленные на полное прекращение огня, а так же на исключение возможности его повторного возникновения",isCorrect:!1},{id:"45c",text:"Отсутствует или предотвращена угроза людям и (или) животным; предотвращена возможность дальнейшего распространения горения; созданы условия для ликвидации пожара имеющимися силами и средствами",isCorrect:!1},{id:"45d",text:"Действия, направленные на предотвращение возможности дальнейшего распространения горения и создание условий для его ликвидации имеющимися силами и средствами",isCorrect:!0}]},{id:46,text:"Какой объем масла необходимо для приготовления 5 литров топливной смеси для двухтактного двигателя",options:[{id:"46a",text:"100 мл",isCorrect:!0},{id:"46b",text:"50 мл",isCorrect:!1},{id:"46c",text:"200 мл",isCorrect:!1}]},{id:47,text:"Первым действием (первым этапом) при оказании первой помощи является:",options:[{id:"47a",text:"Прекращение воздействия травмирующего фактора",isCorrect:!1},{id:"47b",text:"Правильная транспортировка пострадавшего",isCorrect:!1},{id:"47c",text:"Предотвращение возможных осложнений",isCorrect:!1},{id:"47d",text:"Оценка возможной опасности",isCorrect:!0}]},{id:48,text:"Горение каких материалов относится к пожару класса В?",options:[{id:"48a",text:"Пожары металлов и их сплавов",isCorrect:!1},{id:"48b",text:"Пожары газов",isCorrect:!1},{id:"48c",text:"Пожары горючих жидкостей или плавящихся твердых веществ и материалов",isCorrect:!0},{id:"48d",text:"Пожары твердых горючих веществ и материалов",isCorrect:!1},{id:"48e",text:"Пожары горючих веществ и материалов электроустановок, находящихся под напряжением",isCorrect:!1},{id:"48f",text:"Пожары ядерных материалов, радиоактивных отходов и радиоактивных веществ",isCorrect:!1}]},{id:49,text:"Для глубокой заморозки на хладокомбинатах г. Москвы используют ",options:[{id:"49a",text:"Аммиак",isCorrect:!0},{id:"49b",text:"Хлоргидрит кальция",isCorrect:!1},{id:"49c",text:"Фреон",isCorrect:!1}]},{id:50,text:"Симптомы: человек находится в одной позе, долгое время неподвижен, ни на что не реагирует, контакт практически невозможен, относятся к реакции",options:[{id:"50a",text:"апатия",isCorrect:!1},{id:"50b",text:"ступор",isCorrect:!0},{id:"50c",text:"страх",isCorrect:!1}]},{id:51,text:"Какова зависимость количество оборотов от диаметра абразивного отрезного диска УШМ?",options:[{id:"51a",text:"Диск большего диаметра требует меньшее количество оборотов",isCorrect:!0},{id:"51b",text:"Диск большего диаметра требует большее количество оборотов",isCorrect:!1},{id:"51c",text:"Диаметр диска и количество оборотов не связаны между собой",isCorrect:!1}]},{id:52,text:"Для оказания первой помощи при поражении электрическим током необходимо:",options:[{id:"52a",text:"Отключить ток, снять провода с тела, обожженные участки тела смазать жиром, животного или растительного происхождения, наложить повязку; провести сердечно-легочную реанимацию при необходимости",isCorrect:!1},{id:"52b",text:"Провести сердечно-легочную реанимацию при необходимости, на пораженные участки наложить повязки, пострадавшего засыпать по грудь землей",isCorrect:!1},{id:"52c",text:"Убрать поражающий фактор, в случае необходимости провести сердечно-легочную реанимацию, на обожженные участки наложить стерильную повязку",isCorrect:!0}]},{id:53,text:"Назовите тактическую особенность спасательных работ с грузовыми автомобилями и автобусами?",options:[{id:"53a",text:"В связи с большой массой данных транспортных средств необходимо запросить автокран к месту работ ",isCorrect:!1},{id:"53b",text:"В связи с большой высотой данных транспортных средств необходимо использовать лестницы или рабочие площадки",isCorrect:!0},{id:"53c",text:"В связи с большой длинной данных транспортных необходимо использовать большое количество оградительных конусов",isCorrect:!1}]},{id:54,text:"Симптомы: насыщенная, быстрая речь, рыдания, крики, чрезмерное возбуждение, театральные позы, множество движений, относятся к реакции",options:[{id:"54a",text:"страх",isCorrect:!1},{id:"54b",text:"двигательное возбуждение",isCorrect:!1},{id:"54c",text:"истерика",isCorrect:!0}]},{id:55,text:"Что такое полиспаст? ",options:[{id:"55a",text:"Это грузоподъемный механизм, состоящий из подвижных и неподвижных блоков, огибаемых веревкой ",isCorrect:!0},{id:"55b",text:"Это грузоподъемный механизм, состоящий только из подвижных блоков, огибаемый веревкой ",isCorrect:!1},{id:"55c",text:"Это грузоподъемный механизм, состоящий только из неподвижных блоков, огибаемый веревкой",isCorrect:!1}]},{id:56,text:"В какой последовательности следует осматривать пострадавшего при получении им травмы?",options:[{id:"56a",text:"Конечности, область таза и живот, грудная клетка, шея, голова",isCorrect:!1},{id:"56b",text:"Голова, шея, грудная клетка, живот и область таза, конечности",isCorrect:!0},{id:"56c",text:"Грудная клетка, живот и область таза, голова, шея, конечности",isCorrect:!1}]},{id:57,text:"Аммиак в газообразном состоянии",options:[{id:"57a",text:"Поднимается наверх",isCorrect:!0},{id:"57b",text:"Может и подниматься и опускаться. Зависит от времени суток",isCorrect:!1},{id:"57c",text:"Прижимается к земле",isCorrect:!1}]},{id:58,text:"Горение каких материалов относится к пожару класса С?",options:[{id:"58a",text:"Пожары металлов и их сплавов",isCorrect:!1},{id:"58b",text:"Пожары газов",isCorrect:!0},{id:"58c",text:"Пожары твердых горючих веществ и материалов",isCorrect:!1},{id:"58d",text:"Пожары горючих жидкостей или плавящихся твердых веществ и материалов",isCorrect:!1},{id:"58e",text:"Пожары горючих веществ и материалов электроустановок, находящихся под напряжением",isCorrect:!1},{id:"58f",text:"Пожары ядерных материалов, радиоактивных отходов и радиоактивных веществ",isCorrect:!1}]},{id:59,text:"О каких стрессовых реакциях может идти речь? Пострадавшая, 65 лет, во время пожара спряталась под кроватью. Когда ее начали оттуда вытаскивать она стала упираться, крича: Не пойду! Не трогайте меня! Я же сгорю! Зачем вы меня тянете, я боюсь! При этом она несколько раз сильно ударила спасателя: ",options:[{id:"59a",text:"Плач",isCorrect:!1},{id:"59b",text:"Апатия",isCorrect:!1},{id:"59c",text:"Нервная дрож",isCorrect:!1},{id:"59d",text:"Агрессия",isCorrect:!0}]},{id:60,text:"При какой температуре воздуха уже нельзя пользоваться бензопилой?",options:[{id:"60a",text:"При температуре ниже 0",isCorrect:!1},{id:"60b",text:"При температуре ниже - 50",isCorrect:!1},{id:"60c",text:"При температуре ниже - 30",isCorrect:!0}]},{id:61,text:"Как правильно разбивать боковое стекло?",options:[{id:"61a",text:"Разбить стекло сильным ударом руки, обязательно используя защитные перчатки",isCorrect:!1},{id:"61b",text:"Ударять стеклобоем как можно ближе к рамке стекла",isCorrect:!0},{id:"61c",text:"Ударять стеклобоем в центр бокового стекла",isCorrect:!1}]},{id:62,text:"В каких случаях можно удерживать бензопилу при работе одной рукой?",options:[{id:"62a",text:"Работа одной рукой с бензопилой запрещена",isCorrect:!0},{id:"62b",text:"В случае если при движении бензопилы вниз на ее пути отсутствуют препятствия",isCorrect:!1},{id:"62c",text:"Если вес пилы не превышает 4 килограмм",isCorrect:!1}]},{id:63,text:"При проведении ИВЛ (искусственной вентиляции легких) методом «рот в рот» необходимо:",options:[{id:"63a",text:"Зажимать нос пострадавшего только в случае, если носовые ходы свободны",isCorrect:!1},{id:"63b",text:"Нос пострадавшему не зажимать",isCorrect:!1},{id:"63c",text:"Запрокинуть голову (одна рука поддерживает подбородок), верхней рукой плотно зажимать нос пострадавшего, своими губами обхватить рот пострадавшего и сделать выдох",isCorrect:!0}]},{id:64,text:"Симптомы: сильное сердцебиение, учащенное поверхностное дыхание, сниженный контроль за собственным поведением, напряжение мышц (особенно лицевых); данное состояние способно побудить человека к бегству, относятся к реакции",options:[{id:"64a",text:"агрессия",isCorrect:!1},{id:"64b",text:"страх",isCorrect:!0},{id:"64c",text:"нервная дрожь",isCorrect:!1}]},{id:65,text:"На станциях водоподготовки для очистки воды используют ",options:[{id:"65a",text:"Гипохлорит натрия ",isCorrect:!0},{id:"65b",text:"Гипохлорит кальция",isCorrect:!1},{id:"65c",text:"Специальный щелочной раствор",isCorrect:!1}]},{id:66,text:"Какое наибольшее давлении в гидравлическом инструменте Holmatro",options:[{id:"66a",text:"36 МПа",isCorrect:!1},{id:"66b",text:"720 бар",isCorrect:!0},{id:"66c",text:"800 атмосфер",isCorrect:!1}]},{id:67,text:"Для чего производится удаление обшивки салона",options:[{id:"67a",text:"Для обнаружения электропроводки автомобиля",isCorrect:!1},{id:"67b",text:"Для более полной разборки автомобиля ",isCorrect:!1},{id:"67c",text:"Для обнаружения опасных устройств перед разрезанием автомобиля",isCorrect:!0}]},{id:68,text:"В течение какого времени после приготовления можно использовать топливную смесь",options:[{id:"68a",text:"Не более 2 месяцев",isCorrect:!0},{id:"68b",text:"Не более 6 месяцев",isCorrect:!1},{id:"68c",text:"Не более 12 месяцев",isCorrect:!1}]},{id:69,text:"Для обеспечения безопасности пострадавших и спасателей при наличии подушек безопасности необходимо:",options:[{id:"69a",text:"Блокировать только не сработавшие подушки безопасности",isCorrect:!1},{id:"69b",text:"Удалить несработавшие подушки безопасности",isCorrect:!1},{id:"69c",text:"Блокировать все подушки безопасности включая сработавшие",isCorrect:!0}]},{id:72,text:"Как часто нужно очищать воздушный фильтр бензопилы",options:[{id:"72a",text:"Перед каждой работой и после выполнения работ",isCorrect:!0},{id:"72b",text:"Каждый месяц",isCorrect:!1},{id:"72c",text:"Каждый квартал",isCorrect:!1}]},{id:73,text:"Какие меры безопасности необходимо предпринять при обнаружении утечки топлива при спасении из автомобиля:",options:[{id:"73a",text:"Выставить ствольщика, включенного в дыхательный аппарат со стволом наготове и давлением в рукавной линии",isCorrect:!0},{id:"73b",text:"Максимально ускорить проведения спасательных работ",isCorrect:!1},{id:"73c",text:"Буксировать автомобиль от пролива топлива",isCorrect:!1}]},{id:75,text:"Максимальная продолжительность клинической смерти в обычных условиях составляет:",options:[{id:"75a",text:"10-15 мин",isCorrect:!1},{id:"75b",text:"5-6 мин",isCorrect:!0},{id:"75c",text:"2-3 мин",isCorrect:!1},{id:"75d",text:"1-2 мин",isCorrect:!1}]},{id:76,text:"С какими целями проводится стабилизация автомобиля",options:[{id:"76a",text:"Для предотвращения скатывания автомобиля",isCorrect:!1},{id:"76b",text:"Для предотвращения колебаний автомобиля на подвеске, и для предотвращения опрокидывания автомобиля",isCorrect:!1},{id:"76c",text:"Все перечисленные варианты",isCorrect:!0}]},{id:77,text:"Какие из перечисленных мероприятий не относятся к оказанию первой помощи?",options:[{id:"77a",text:"Выявление признаков наличия травм, отравлений и других состояний, угрожающих жизни и здоровью",isCorrect:!1},{id:"77b",text:"Оценка обстановки и создание безопасных условий для оказания первой помощи",isCorrect:!1},{id:"77c",text:"Придание оптимального положения телу",isCorrect:!1},{id:"77d",text:"Применение лекарственных препаратов",isCorrect:!0}]},{id:78,text:"Назовите операции, которые выполняются с использованием расширителя?",options:[{id:"78a",text:"Сдавливание крыла автомобиля для создания зазора между дверью и крылом",isCorrect:!1},{id:"78b",text:"Вскрытие капота автомобиля",isCorrect:!1},{id:"78c",text:"Отрывание дверей автомобиля",isCorrect:!1},{id:"78d",text:"Все перечисленные",isCorrect:!0}]},{id:79,text:"Недостаточно развитые профессионально важные качества:",options:[{id:"79a",text:"являются четким указанием на профессиональную непригодность",isCorrect:!1},{id:"79b",text:"не оказывают никакого влияния на надежность и эффективность профессиональной деятельности",isCorrect:!1},{id:"79c",text:"могут быть скомпенсированы другими, более развитыми профессионально важными качествами",isCorrect:!0}]},{id:80,text:"К каким последствием может привести работа гидравлического инструмента, когда пробка маслобака насосной станции находиться в транспортном положении",options:[{id:"80a",text:"Возможно вытекания излишков гидравлического масла через пробку",isCorrect:!1},{id:"80b",text:"Возможен разрыв маслобака из-за невозможности вытекании масла через пробку ",isCorrect:!0},{id:"80c",text:"Транспортное или рабочее положения пробки маслобака на работу насосной станции не влияет",isCorrect:!1}]},{id:70,text:"Признаки венозного кровотечения",options:[{id:"70a",text:"Кровь пассивно стекает из раны",isCorrect:!0},{id:"70b",text:"Над раной образуется валик из вытекающей крови",isCorrect:!1},{id:"70c",text:"Алая кровь из раны вытекает фонтанирующей струей",isCorrect:!1}]},{id:71,text:"Выберите наибольшие опасности при спасательных работах при электрическими и гибридными автомобилями:",options:[{id:"71a",text:"Опасность срабатывания подушек безопасности",isCorrect:!1},{id:"71b",text:"Выделение водорода, а также едкого электролита из аккумуляторных батарей",isCorrect:!1},{id:"71c",text:"Наличие высокого напряжения тяговой бортовой сети (до 850 вольт) и потенциальная опасность самопроизвольного движения автомобиля",isCorrect:!0}]},{id:74,text:"Неспецифическая реакция организма на любое предъявляемое ему требование – это: ",options:[{id:"74a",text:"горевание",isCorrect:!1},{id:"74b",text:"стресс",isCorrect:!0},{id:"74c",text:"страх",isCorrect:!1}]},{id:81,text:"Можно ли пилить бензопилой на высоте выше уровня плечь",options:[{id:"81a",text:"Запрещено",isCorrect:!0},{id:"81b",text:"Разрешено",isCorrect:!1},{id:"81c",text:"Разрешено при нахождении в устойчивом положении",isCorrect:!1}]},{id:82,text:"Какой вид гидравлического инструмента невозможно заменить другим видом при спасении из автомобилей?",options:[{id:"82a",text:"Кусачки в связи с необходимостью резки кузова",isCorrect:!1},{id:"82b",text:"Домкрат для выдавливания приборной панели",isCorrect:!0},{id:"82c",text:"Расширитель в связи с необходимостью отрывания дверей",isCorrect:!1}]},{id:83,text:"Где указывается информация о времени и дате наложения кровоостанавливающего жгута?",options:[{id:"83a",text:"На записке, прикрепляемой к жгуту",isCorrect:!1},{id:"83b",text:"На специальной карточке, прикрепляемой к одежде",isCorrect:!1},{id:"83c",text:"На лбу или щеке",isCorrect:!0},{id:"83d",text:"На жгуте",isCorrect:!1}]},{id:84,text:"Какие рабочие зоны выделяться на месте спасательных работ при ДТП:",options:[{id:"84a",text:"Зона непосредственной работы (2 метра), зона готовности (2-5 метров), зона ожидания (дальше 5 метров), площадка развёртывания инструмента (в зоне ожидания), место для обломков (дальше 5 метров)",isCorrect:!0},{id:"84b",text:"Зона медицинской помощи (2 метра), зона управления спасательными работами (2-5 метров), зона организации взаимодействия служб (дальше 5 метров), место для посторонних лиц",isCorrect:!1},{id:"84c",text:"Зона само-взаимопомощи (2 метра), зона изоляции (2-5 метров), зона релаксации (дальше 5 метров), зона передачи информации",isCorrect:!1}]},{id:85,text:"Чем является окись углерода",options:[{id:"85a",text:"Угарным газом",isCorrect:!0},{id:"85b",text:"Аварийно-химически отравляющим веществом ",isCorrect:!1},{id:"85c",text:"Это выдыхаемый, человеком газ",isCorrect:!1}]},{id:86,text:"Как рассчитать запас воздуха в баллоне для наполнения подушек низкого давления Holmatro, Veter",options:[{id:"86a",text:"Объем баллона умножить на давление в баллоне",isCorrect:!0},{id:"86b",text:"Объем баллона умножить на давления в баллоне и разделить на коэффициент сжимаемости воздуха ",isCorrect:!1},{id:"86c",text:"Объем баллона умножить на давления в баллоне и умножить на коэффициент сжимаемости воздуха ",isCorrect:!1}]},{id:87,text:"Для чего предназначен поисковый прибор АПП-1 ",options:[{id:"87a",text:"Предназначен для поиска живых людей под завалами",isCorrect:!0},{id:"87b",text:"Предназначен для излучения акустического сигнала для установки маркеров (меток) при поиске пострадавших на завале",isCorrect:!1},{id:"87c",text:"Предназначен для усиления передачи радиосвязи в зоне ЧС",isCorrect:!1}]},{id:88,text:"Каким способом можно заглушить дизельный двигатель автомобиля:",options:[{id:"88a",text:"Только выключением зажигания",isCorrect:!1},{id:"88b",text:"Прекращения подачи топлива, путем перекрытия (пережатия) топливного шланга",isCorrect:!1},{id:"88c",text:"Путем подачи углекислоты из углекислотного огнетушителя в воздухозаборный канал",isCorrect:!1},{id:"88d",text:"Все три способа",isCorrect:!0}]},{id:89,text:"Кто осуществляет отключение электрических сетей и установок напряжением выше 0,38 кВ",options:[{id:"89a",text:"Пожарный при наличии диэлектрического комплекта",isCorrect:!1},{id:"89b",text:"Пожарный при наличии четвертой группы электробезопасности и диэлектрического комплекта",isCorrect:!1},{id:"89c",text:"Представитель служб эксплуатации этих сетей и установок",isCorrect:!0},{id:"89d",text:"РТП или командир отделения при наличии четвертой группы электробезопасности и диэлектрического комплекта",isCorrect:!1}]},{id:90,text:"Назовите характерные признаки ступора",options:[{id:"90a",text:"движения резкие, часто бесцельные и бессмысленные",isCorrect:!1},{id:"90b",text:"«застывание» в определенной позе",isCorrect:!0},{id:"90c",text:"безразличное отношение к окружающему, вялость, заторможенность",isCorrect:!1},{id:"90d",text:"речь медленная, с большими паузами",isCorrect:!1}]},{id:91,text:"При каких состояниях нужно оказать первую помощь?",options:[{id:"91a",text:"Ожоги",isCorrect:!0},{id:"91b",text:"Высокая температура",isCorrect:!1},{id:"91c",text:"Боли в животе",isCorrect:!1}]},{id:92,text:"Какой порядок действии при безуспешных попытках запуска бензопилы или бензореза ",options:[{id:"92a",text:"Выкрутить свечу зажигания, перевернуть пилу свечным отверстием вниз и несколько раз дернуть стартер. Затем поставить заведомо исправную свечу и заводить, соблюдая порядок запуска",isCorrect:!0},{id:"92b",text:"Выкрутить свечу зажигания, залить топливо в цилиндр, поставить свечу обратно. Заводить, соблюдая порядок запуска",isCorrect:!1},{id:"92c",text:"Вытянуть рукоятку воздушной заслонки и запускать бензопилу энергичными рывками стартера",isCorrect:!1}]},{id:93,text:"Разрешается ли работать абразивным диском при его намокании?",options:[{id:"93a",text:"Да, работа возможна ",isCorrect:!1},{id:"93b",text:"Нет, работа намокшим абразивным диском запрещена ",isCorrect:!0},{id:"93c",text:"Да, работа возможна если время замачивания не превышает 30 минут",isCorrect:!1}]},{id:94,text:"Если кровь изливается в полости тела, внутренние органы, то такое кровотечение называется?",options:[{id:"94a",text:"Внутренним",isCorrect:!0},{id:"94b",text:"Полостным",isCorrect:!1},{id:"94c",text:"Закрытым",isCorrect:!1}]},{id:95,text:"Каким способом следует обесточивать оранжевые провода высокого напряжения тяговой сети электрических и гибридных автомобилей?",options:[{id:"95a",text:"Перерезать диэлектрическими ножницами для резки проводов",isCorrect:!1},{id:"95b",text:"Любые способы резки оранжевых проводов запрещены из-за высокого напряжения (850 вольт)",isCorrect:!0},{id:"95c",text:"Перерезать гидравлическим инструментом с соблюдением мер безопасности",isCorrect:!1},{id:"95d",text:"Обесточивать электрические и гибридные автомобили имеют права только лица с 4 группой допуска по электробезопасности",isCorrect:!1}]},{id:96,text:"Какое максимально количество пневмодомкратов допускается укладывать друг на друга при подъеме грузов",options:[{id:"96a",text:"Не более 1",isCorrect:!1},{id:"96b",text:"Не более 2",isCorrect:!0},{id:"96c",text:"Не регламентируется",isCorrect:!1}]},{id:97,text:"При каких состояниях можно оказать первую помощь?",options:[{id:"97a",text:"Инородные тела верхних дыхательных путей",isCorrect:!0},{id:"97b",text:"Боли в животе",isCorrect:!1},{id:"97c",text:"Боли в груди",isCorrect:!1},{id:"97d",text:"Высокая температура",isCorrect:!1}]},{id:98,text:"Какими способами следует стабилизировать автомобиль на склоне при угрозе его опрокидывания?",options:[{id:"98a",text:"Подкоп под колесами автомобиля, находящимися выше по склону",isCorrect:!1},{id:"98b",text:"Способом крепления при помощи альпинистских веревок, багажных строп с трещотками, цепями к прочной опоре",isCorrect:!0},{id:"98c",text:"Путем установки подпорок из подручных средств",isCorrect:!1}]},{id:99,text:"Как следует расположить руки на грудной клетке пострадавшего при давлении руками на его грудину (выполнении непрямого массажа сердца)?",options:[{id:"99a",text:"Основания ладоней обеих рук должны располагаться на грудной клетке на два пальца выше мечевидного отростка так, чтобы большой палец одной руки указывал в сторону левого плеча пострадавшего, а другой – в сторону правого плеча",isCorrect:!1},{id:"99b",text:"Основания ладоней обеих рук, которые накладываются одна на другую, должны располагаться на грудине на два пальца выше мечевидного отростка так, чтобы большой палец одной руки указывал в сторону подбородка пострадавшего, а другой – в сторону живота",isCorrect:!0},{id:"99c",text:"Давление руками на грудину выполняют основанием ладони только одной руки, расположенной на грудной клетке на два пальца выше мечевидного отростка. Направление большого пальца не имеет значения",isCorrect:!1}]},{id:100,text:"Ватно-марлевая повязка, противопыльная тканевая маска может использоваться",options:[{id:"100a",text:"Только как простейшие средства защиты органов дыхания",isCorrect:!0},{id:"100b",text:"Если смочить в содовом растворе, можно использовать для защиты от окиси углерода",isCorrect:!1},{id:"100c",text:"Вообще нигде нельзя использовать",isCorrect:!1}]},{id:101,text:"Какие меры безопасности необходимо предпринять при разрезании лобового стекла:",options:[{id:"101a",text:"Спасателям использовать защиту глаз и защиту дыхания от стеклянной пыли (противопылевой респиратор), пострадавшего накрыть защитной пленкой, надеть противопылевой респиратор или маску с подачей кислорода",isCorrect:!0},{id:"101b",text:"Достаточно накрыть пострадавшего защитной пленкой, а спасателям использовать защиту глаз",isCorrect:!1},{id:"101c",text:"Резать стекло аккуратно, не допуская попадания осколков в глаза, а стеклянной пыли в органы дыхания",isCorrect:!1}]},{id:102,text:"Признаки артериального кровотечения",options:[{id:"102a",text:"Очень темный цвет крови",isCorrect:!1},{id:"102b",text:"Кровь пассивно стекает из раны",isCorrect:!1},{id:"102c",text:"Большое кровавое пятно на одежде или лужа крови возле пострадавшего",isCorrect:!0}]},{id:103,text:"При каком количестве пострадавших при ДТП с участием транспортного средства, осуществляющего пассажирских перевозки и имеющего более 8 сидячих мест относится к чрезвычайной ситуации?",options:[{id:"103a",text:"Погиб 1 человек и более или пострадало 3 человека и более",isCorrect:!1},{id:"103b",text:"Погибло 5 человек и более или пострадали 10 человек и более",isCorrect:!0},{id:"103c",text:"Пострадало или погибло более 2 человек",isCorrect:!1}]},{id:104,text:"Диск рассчитанный на какие обороты разрешается использовать на бензорезе",options:[{id:"104a",text:"Не больше 4500 оборотов в минуту",isCorrect:!1},{id:"104b",text:"Не меньше 4500 оборотов в минуту",isCorrect:!1},{id:"104c",text:"Не меньше 5300 оборотов в минуту",isCorrect:!0}]},{id:105,text:"В результате ДТП мотоциклист в мотошлеме лежит на проезжей части. Выберете правильные варианты:",options:[{id:"105a",text:"При оказании первой помощи необходимо снять с пострадавшего шлем вдвоем: Один спасатель проникает руками в медицинских перчатках под шлем, удерживая голову пострадавшего с боков, второй спасатель аккуратно и медленно снимает с пострадавшего шлем",isCorrect:!0},{id:"105b",text:"Пострадавшего следует передать бригаде скорой помощи в шлеме",isCorrect:!1},{id:"105c",text:"Разрезать шлем на пострадавшем при помощи аварийно-спасательного инструмента, такого как: болторез, ножницы по металлу, углошлифовальная машина, пила для резки лобового стекла, сабельная пила, соблюдая меры безопасности",isCorrect:!1}]},{id:106,text:"Признаки поверхностного ожога",options:[{id:"106a",text:"Покраснение и отек кожи в месте воздействия поражающего агента, а также появление пузырей, заполненных прозрачной жидкостью",isCorrect:!0},{id:"106b",text:"Обугленная кожа, пузыри с мутной жидкостью",isCorrect:!1},{id:"106c",text:"Ярко красная кожа, сыпь по типу комариных укусов",isCorrect:!1}]},{id:107,text:"Выберете максимальную глубину пропила бензорезом с диском 350 мм.",options:[{id:"107a",text:"120 мм",isCorrect:!0},{id:"107b",text:"175 мм ",isCorrect:!1},{id:"107c",text:"350 мм",isCorrect:!1}]},{id:108,text:"При сильном кровотечении наложенный жгут нельзя держать более:",options:[{id:"108a",text:"1 час",isCorrect:!0},{id:"108b",text:"30 мин",isCorrect:!1},{id:"108c",text:"45 мин",isCorrect:!1}]},{id:109,text:"Когда должен применяться непрямой массаж сердца?",options:[{id:"109a",text:"При кровотечении",isCorrect:!1},{id:"109b",text:"После освобождения пострадавшего от опасного фактора",isCorrect:!1},{id:"109c",text:"При повышении артериального давления",isCorrect:!1},{id:"109d",text:"При отсутствии сознания, дыхания и пульса",isCorrect:!0}]},{id:110,text:"Какое минимальное число точек стабилизации при нахождении автомобиля на колесах:",options:[{id:"110a",text:"Не менее 2 опор",isCorrect:!1},{id:"110b",text:"Не менее 5 опор",isCorrect:!1},{id:"110c",text:"Не менее 3 опор",isCorrect:!0}]},{id:111,text:"Признаки глубокого ожога",options:[{id:"111a",text:"Пузыри, заполненных кровянистым содержимым, которые могут быть частично разрушены, кожа может обугливаться",isCorrect:!0},{id:"111b",text:"Пузыри, заполненные прозрачной жидкостью, покраснение кожи",isCorrect:!1},{id:"111c",text:"Ярко красная кожа, наличие кожных язв",isCorrect:!1}]},{id:112,text:"При ДТП какого вида и характере повреждений наиболее вероятно зажатие педалями автомобиля ног водителя?",options:[{id:"112a",text:"Боковое столкновение",isCorrect:!1},{id:"112b",text:"Опрокидывание на крышу",isCorrect:!1},{id:"112c",text:"Тыльное столкновение",isCorrect:!1},{id:"112d",text:"Лобовое столкновение",isCorrect:!0}]},{id:113,text:"Для защиты от хлора используется",options:[{id:"113a",text:"Промышленный противогаз (коробка серого цвета)",isCorrect:!1},{id:"113b",text:"Промышленный противогаз (коробка желтого цвета)",isCorrect:!0},{id:"113c",text:"Общевойсковой фильтрующий противогаз",isCorrect:!1}]},{id:114,text:"Выберете порядок остановки двигателя насосной станции перед убытием к месту дислокации",options:[{id:"114a",text:"Остановить двигатель выключателем зажигания ",isCorrect:!1},{id:"114b",text:"Перекрыть подачу топлива бензокраном и дождаться остановки двигателя",isCorrect:!0},{id:"114c",text:"Перевести двигатель на холостые обороты и через одну минуту выключить зажигания",isCorrect:!1}]},{id:115,text:"Перед применением бензопилы нужно убедиться:",options:[{id:"115a",text:"В исправности тормоза цепи, выключателя зажигания, нормальном натяжении цепи, исправности креплений, отсутствии подтекания бензина",isCorrect:!0},{id:"115b",text:"В чистоте воздушного фильтра, исправности глушителя, остроте заточки цепи, в полной заправке топливной смесью",isCorrect:!1},{id:"115c",text:"В наличии необходимой маркировки на корпусе пилы и правильности заполнения рабочей документации",isCorrect:!1}]},{id:116,text:"Можно ли извлекать инородный предмет из раны?",options:[{id:"116a",text:"Да",isCorrect:!1},{id:"116b",text:"Нет",isCorrect:!0}]},{id:117,text:"Что не запрещено при работе с углошлифовальной машинкой (УШМ)",options:[{id:"117a",text:"Работать с электроинструментом со случайных подставок (подоконники, ящики, стулья), на приставных лестницах",isCorrect:!1},{id:"117b",text:"Обрабатывать электроинструментом обледеневшие и мокрые детали",isCorrect:!1},{id:"117с",text:"Производить резку металла толщиною меньше 0,5 мм",isCorrect:!0}]},{id:118,text:"Какие операции необходимо выполнить для проверки натяжения ремня бензореза ",options:[{id:"118a",text:"Ослабить гайки крепления режущей консоли, проверить натяжение по указателю",isCorrect:!0},{id:"118b",text:"Проверить натяжения ремня по указателю при необходимости отрегулировать натяжения винтом",isCorrect:!1},{id:"118с",text:"Определить натяжение ремня нажатием пальца",isCorrect:!1}]},{id:119,text:"Легковой автомобиль находиться на правом боку. Ноги водителя зажаты педалями, водитель висит на ногах и жалуется на сильную боль. Что необходимо предпринять? ",options:[{id:"119a",text:"При помощи взаимодействующих сил и населения опустить автомобиль",isCorrect:!1},{id:"119b",text:"Стабилизировать автомобиль в боковом положении, создать экстренный доступ к пострадавшему путем удаления стекла и послать спасателя в салон поддерживать пострадавшего на весу своей спиной, деблокировать пострадавшего",isCorrect:!0},{id:"119с",text:"Стабилизировать автомобиль в боковом положении, создать доступ к пострадавшему путем удаления крыши, удерживать пострадавшего на весу при помощи щита, деблокировать пострадавшего",isCorrect:!1}]},{id:120,text:"Горение каких материалов относится к пожару класса E? ",options:[{id:"120a",text:"Пожары металлов и их сплавов. ",isCorrect:!1},{id:"120b",text:"Пожары газов ",isCorrect:!1},{id:"120с",text:"Пожары горючих веществ и материалов электроустановок, находящихся под напряжением",isCorrect:!0}]},{id:121,text:"Горение каких материалов относится к пожару класса F? ",options:[{id:"121a",text:"Пожары газов ",isCorrect:!1},{id:"121b",text:"Пожары металлов и их сплавов ",isCorrect:!1},{id:"121с",text:"Пожары электроустановок под напряжением ",isCorrect:!1},{id:"121d",text:"Пожары ядерных материалов, радиоактивных отходов и радиоактивных ",isCorrect:!0}]},{id:122,text:"Мобильные средства пожаротушения подразделяются на следующие типы:",options:[{id:"122a",text:"Пожарные самолеты, вертолеты ",isCorrect:!1},{id:"122b",text:"Пожарные автомобили (основные и специальные), пожарные мотопомпы, приспособленные технические средства (тягачи, прицепы и трактора)",isCorrect:!1},{id:"122с",text:"Пожарные поезда, пожарные суда",isCorrect:!1},{id:"122d",text:"Все вышеперечисленное ",isCorrect:!0}]},{id:123,text:"Боевые действия по тушению пожаров: ",options:[{id:"123a",text:"Начинаются с момента прибытия к месту вызова и считаются законченными с момента полной ликвидации пожара и устранения условий его повторного возникновения ",isCorrect:!1},{id:"123b",text:"Начинаются с момента полу
